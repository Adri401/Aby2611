<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB 3DS·B · Repaso Anual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <div class="wrap">
      <h1>HUB 3.º DS «B»</h1>
      <p class="lead">Portal de repaso anual de módulos · Instituto Nacional Cantón Lourdes (INDEL)</p>

      <!-- Barra de progreso -->
      <div class="progreso-bar">
        <span id="progreso-txt" style="font-weight:600; font-size:0.9rem;">0 de 4 repasados (0%)</span>
        <div class="pista">
          <div id="progreso-fill" class="pista-fill"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Buscador y filtros -->
    <section class="controles">
      <input type="text" id="input-busqueda" placeholder="Buscar módulo por código, nombre o palabra clave...">
      <select id="select-docente">
        <option value="todos">Todos los docentes</option>
        <option value="Javier Mineros">Javier Mineros</option>
        <option value="Arcides Canales">Arcides Canales</option>
      </select>
    </section>

    <p id="contador-modulos" style="color:var(--mut); margin-bottom: 16px; font-size: 0.9rem;"></p>

    <!-- Grid de módulos dinámicos -->
    <section id="contenedor-modulos" class="grid-modulos">
      <!-- Pintado desde js/app.js -->
    </section>
  </main>

  <!-- Modal Ficha de Módulo -->
  <dialog id="modal-ficha">
    <div class="modal-head">
      <span>Ficha de Módulo</span>
      <button id="btn-cerrar-modal" class="close-btn">&times;</button>
    </div>
    <div id="modal-body">
      <!-- Se llena dinámicamente -->
    </div>
  </dialog>

  <footer>
    <div class="wrap">
      <p>Desarrollado por el equipo de 3.º Bachillerato Vocacional en Desarrollo de Software «B»</p>
    </div>
  </footer>

  <script src="data/modulos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
